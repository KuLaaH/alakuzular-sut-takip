<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Alakuzular Gıda - Süt Toplama, Süzme Yoğurt & Maliyet Sistemi</title>
  <style>
    :root {
      --navy: #0F294A;
      --navy-light: #163660;
      --navy-hover: #1d467a;
      --amber: #F59E0B;
      --amber-light: #FEF3C7;
      --card-cream: #F3D899;
      --card-border: #8B6914;
      --bg: #F4F5F7;
      --surface: #FFFFFF;
      --text: #1E293B;
      --muted: #64748B;
      --border: #CBD5E1;
      --green: #059669;
      --green-bg: #ECFDF5;
      --red: #DC2626;
      --red-bg: #FEF2F2;
      --purple: #7C3AED;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      line-height: 1.45;
      overflow-x: hidden;
      padding-bottom: 48px;
    }

    button, input, select, textarea {
      font-family: inherit;
    }

    button {
      cursor: pointer;
      border: none;
      transition: all 0.15s ease;
    }

    button:disabled {
      opacity: 0.55;
      cursor: not-allowed;
    }

    /* LAYOUT & CONTAINERS */
    .container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 0 14px;
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      box-shadow: 0 2px 8px rgba(15, 41, 74, 0.06);
      overflow: hidden;
      margin-bottom: 18px;
    }

    .card-header {
      background: var(--navy);
      color: #fff;
      padding: 14px 18px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 8px;
    }

    .card-header h2, .card-header h3 {
      font-size: 16px;
      font-weight: 800;
    }

    .card-body {
      padding: 18px;
    }

    /* GRID HELPERS */
    .grid-2 {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 14px;
    }

    .grid-3 {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 14px;
    }

    .grid-4 {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 14px;
    }

    @media (max-width: 900px) {
      .grid-4 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .grid-3 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    }

    @media (max-width: 640px) {
      .grid-4, .grid-3, .grid-2 { grid-template-columns: 1fr; }
    }

    /* FORMS */
    .form-group {
      display: flex;
      flex-direction: column;
      gap: 5px;
    }

    .form-label {
      font-size: 11px;
      font-weight: 800;
      text-transform: uppercase;
      color: var(--muted);
      letter-spacing: 0.4px;
    }

    .form-control {
      width: 100%;
      padding: 11px 12px;
      border: 1.5px solid var(--border);
      border-radius: 11px;
      font-size: 14px;
      font-weight: 700;
      color: var(--text);
      background: #F8FAFC;
      outline: none;
    }

    .form-control:focus {
      border-color: var(--navy);
      background: #fff;
    }

    .form-control:disabled {
      background: #E2E8F0;
      color: #475569;
    }

    /* BUTTONS */
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 11px 16px;
      border-radius: 12px;
      font-size: 13px;
      font-weight: 800;
      text-align: center;
    }

    .btn-primary { background: var(--navy); color: #fff; }
    .btn-primary:hover:not(:disabled) { background: var(--navy-hover); }

    .btn-success { background: var(--green); color: #fff; }
    .btn-success:hover:not(:disabled) { background: #047857; }

    .btn-amber { background: var(--amber); color: var(--navy); }
    .btn-amber:hover:not(:disabled) { background: #D97706; color: #fff; }

    .btn-danger { background: var(--red); color: #fff; }
    .btn-danger:hover:not(:disabled) { background: #B91C1C; }

    .btn-outline {
      background: #fff;
      color: var(--navy);
      border: 1.5px solid var(--border);
    }
    .btn-outline:hover:not(:disabled) { background: #F1F5F9; border-color: var(--navy); }

    .btn-sm {
      padding: 7px 11px;
      font-size: 12px;
      border-radius: 9px;
    }

    .btn-block { width: 100%; }

    /* BADGES */
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 3px 10px;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 800;
    }
    .badge-navy { background: var(--navy); color: #fff; }
    .badge-amber { background: #FEF3C7; color: #92400E; border: 1px solid #F59E0B; }
    .badge-green { background: #D1FAE5; color: #065F46; }
    .badge-red { background: #FEE2E2; color: #991B1B; border: 1px solid #EF4444; }
    .badge-purple { background: #EDE9FE; color: #5B21B6; }

    /* HEADER & NAV */
    .topbar {
      background: var(--navy);
      color: #fff;
      position: sticky;
      top: 0;
      z-index: 40;
      box-shadow: 0 3px 12px rgba(0, 0, 0, 0.18);
    }

    .topbar-inner {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 14px;
      max-width: 1200px;
      margin: 0 auto;
      flex-wrap: wrap;
      gap: 10px;
    }

    .brand-title {
      font-size: 19px;
      font-weight: 900;
      letter-spacing: 0.3px;
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .brand-sub {
      font-size: 12px;
      color: #CBD5E1;
      margin-top: 2px;
    }

    .nav-bar {
      background: var(--navy-light);
      border-top: 1px solid rgba(255, 255, 255, 0.12);
      overflow-x: auto;
    }

    .nav-inner {
      max-width: 1200px;
      margin: 0 auto;
      padding: 7px 14px;
      display: flex;
      gap: 8px;
    }

    .nav-btn {
      background: transparent;
      color: #E2E8F0;
      padding: 9px 14px;
      border-radius: 10px;
      font-size: 13px;
      font-weight: 800;
      white-space: nowrap;
      flex: 1;
      min-width: max-content;
    }

    .nav-btn:hover { background: rgba(255, 255, 255, 0.12); }
    .nav-btn.active {
      background: #fff;
      color: var(--navy);
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.15);
    }

    /* LOGIN SCREEN */
    .login-wrapper {
      min-height: 100vh;
      background: linear-gradient(135deg, #091B32 0%, #163660 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }

    .login-box {
      background: #fff;
      width: 100%;
      max-width: 520px;
      border-radius: 22px;
      overflow: hidden;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.35);
    }

    .login-hero {
      background: var(--navy);
      color: #fff;
      padding: 24px 20px;
      text-align: center;
      border-bottom: 4px solid var(--amber);
    }

    .quick-role-btn {
      text-align: left;
      background: #F8FAFC;
      border: 2px solid var(--border);
      border-radius: 14px;
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .quick-role-btn:hover {
      border-color: var(--navy);
      background: #EFF6FF;
    }

    /* COLLECTOR BIG ACCESSIBLE UI */
    .big-action-btn {
      width: 100%;
      padding: 18px 16px;
      border-radius: 16px;
      font-size: clamp(16px, 3.8vw, 20px);
      font-weight: 900;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      box-shadow: 0 4px 12px rgba(15, 41, 74, 0.15);
    }

    .producer-select-card {
      width: 100%;
      text-align: left;
      background: #fff;
      border: 2px solid var(--border);
      border-radius: 14px;
      padding: 14px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 10px;
    }

    .producer-select-card:hover {
      border-color: var(--navy);
      background: #F0F9FF;
    }

    .huge-milk-input {
      width: 100%;
      padding: 14px 8px;
      font-size: clamp(26px, 6vw, 38px);
      font-weight: 900;
      text-align: center;
      border: 3px solid var(--navy);
      border-radius: 16px;
      color: var(--navy);
      background: #fff;
      outline: none;
    }

    .huge-milk-input:focus {
      border-color: var(--green);
      box-shadow: 0 0 0 4px rgba(5, 150, 105, 0.15);
    }

    .quick-add-btn {
      background: #E0F2FE;
      color: var(--navy);
      border: 1.5px solid #7DD3FC;
      border-radius: 12px;
      padding: 12px 6px;
      font-size: 15px;
      font-weight: 900;
    }

    .quick-add-btn:hover { background: #BAE6FD; }

    /* STAT BOXES */
    .stat-box {
      background: #fff;
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 15px;
    }

    .stat-title {
      font-size: 11px;
      font-weight: 800;
      color: var(--muted);
      text-transform: uppercase;
    }

    .stat-value {
      font-size: clamp(20px, 3vw, 26px);
      font-weight: 900;
      color: var(--navy);
      margin-top: 4px;
    }

    /* ALERTS */
    .alert-banner {
      padding: 14px 16px;
      border-radius: 14px;
      font-weight: 800;
      font-size: 13px;
      margin-bottom: 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      flex-wrap: wrap;
    }

    .alert-danger {
      background: var(--red);
      color: #fff;
      border: 2px solid #991B1B;
    }

    .alert-warning {
      background: #FEF3C7;
      color: #92400E;
      border: 1.5px solid #F59E0B;
    }

    .alert-success {
      background: #D1FAE5;
      color: #065F46;
      border: 1.5px solid #10B981;
    }

    /* TABLES */
    .table-wrap {
      width: 100%;
      overflow-x: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 12.5px;
    }

    th {
      background: var(--navy);
      color: #fff;
      padding: 10px 10px;
      text-align: left;
      font-weight: 800;
      text-transform: uppercase;
      font-size: 11px;
      white-space: nowrap;
    }

    td {
      padding: 10px 10px;
      border-bottom: 1px solid #E2E8F0;
      vertical-align: middle;
    }

    tr:hover td { background: #F8FAFC; }

    .text-right { text-align: right; }
    .text-center { text-align: center; }

    /* PHYSICAL CREAM PRODUCER CARD */
    .physical-card {
      background: var(--card-cream);
      border: 3px solid var(--card-border);
      border-radius: 16px;
      padding: 18px;
      color: #1E1B18;
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.12);
    }

    .physical-card table th {
      background: #D9B36C;
      color: #1E1B18;
      border: 1px solid var(--card-border);
      text-align: center;
      padding: 6px 4px;
    }

    .physical-card table td {
      border: 1px solid var(--card-border);
      padding: 5px 6px;
      text-align: center;
      font-weight: 700;
      background: rgba(255, 255, 255, 0.45);
    }

    /* TOAST & OVERLAYS */
    .toast-box {
      position: fixed;
      top: 16px;
      right: 16px;
      z-index: 999;
      padding: 14px 18px;
      border-radius: 14px;
      color: #fff;
      font-weight: 800;
      font-size: 13px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.25);
      max-width: 380px;
    }

    .save-flash {
      position: fixed;
      inset: 0;
      background: rgba(5, 150, 105, 0.96);
      color: #fff;
      z-index: 998;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 24px;
    }

    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(15, 23, 42, 0.75);
      z-index: 900;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
      overflow-y: auto;
    }

    .modal-box {
      background: #fff;
      border-radius: 20px;
      max-width: 480px;
      width: 100%;
      overflow: hidden;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.35);
    }

    .shift-toggle {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 6px;
      background: #E2E8F0;
      padding: 4px;
      border-radius: 12px;
    }

    .shift-btn {
      padding: 10px;
      border-radius: 9px;
      font-weight: 800;
      font-size: 13px;
      background: transparent;
      color: #475569;
    }

    .shift-btn.active-sabah {
      background: var(--amber);
      color: #fff;
    }

    .shift-btn.active-aksam {
      background: var(--navy);
      color: #fff;
    }

    @media print {
      .no-print, .topbar, .nav-bar { display: none !important; }
      body { background: #fff; padding: 0; }
      .card { box-shadow: none; border: 1px solid #000; }
    }
  </style>
</head>

      // =========================================================================
      // 1. TARİH VE FORMAT YARDIMCILARI
      // =========================================================================
      function getLocalYMD(offsetDays) {
        const d = new Date();
        if (offsetDays) d.setDate(d.getDate() + offsetDays);
        const y = d.getFullYear();
        const m = String(d.getMonth() + 1).padStart(2, '0');
        const day = String(d.getDate()).padStart(2, '0');
        return `${y}-${m}-${day}`;
      }

      const TODAY_STR = getLocalYMD(0);
      const YESTERDAY_STR = getLocalYMD(-1);
      const STRAINED_LIMIT = 3.20;

      function fmtKg(val) {
        const n = Number(val);
        if (isNaN(n)) return '0,0';
        return n.toLocaleString('tr-TR', { minimumFractionDigits: 1, maximumFractionDigits: 2 });
      }

      function fmtRatio(val) {
        const n = Number(val);
        if (isNaN(n) || !isFinite(n)) return '0,00';
        return n.toLocaleString('tr-TR', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
      }

      function fmtMoney(val) {
        const n = Number(val);
        if (isNaN(n) || !isFinite(n)) return '0,00 ₺';
        return n.toLocaleString('tr-TR', { minimumFractionDigits: 2, maximumFractionDigits: 2 }) + ' ₺';
      }

      function escHtml(str) {
        if (str === null || str === undefined) return '';
        return String(str)
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;');
      }

          {
            id: `yog-${YESTERDAY_STR}-Sabah`,

      function getRoute(id) {
        return state.routes.find(r => r.id === id) || { id, plate: 'PLAKA YOK', name: 'Tanımsız Rota' };
      }

      function getProducer(id) {
        return state.producers.find(p => p.id === id) || null;
      }

      function getEffectiveRouteId() {
        if (state.currentUser && state.currentUser.role === 'collector' && state.currentUser.assignedRouteId) {
          return state.currentUser.assignedRouteId;
        }
        return state.selectedRoute;
      }

      function getDepotStock() {
        const totalIn = state.weighings.reduce((s, w) => s + (Number(w.centerWeight) || 0), 0);
        const totalOut = state.yogurtBatches.reduce((s, b) => s + (Number(b.fermentedMilkKg) || 0), 0);
        return {
          totalIn: Math.round(totalIn * 100) / 100,
          totalOut: Math.round(totalOut * 100) / 100,
          remaining: Math.round((totalIn - totalOut) * 100) / 100
        };
      }

      function getEffectiveTariff(targetDate) {
        const sorted = [...state.tariffs].sort((a, b) => b.effectiveFrom.localeCompare(a.effectiveFrom));
        return sorted.find(t => t.effectiveFrom <= targetDate) || sorted[sorted.length - 1];
      }

      function calculateDayFinancials(targetDate) {
        const tariff = getEffectiveTariff(targetDate);
        const dayCols = state.collections.filter(c => c.date === targetDate);

        const prodMap = new Map();
        dayCols.forEach(c => {
          const p = getProducer(c.producerId);
          const uPrice = p ? Number(p.unitPrice) || 18.0 : 18.0;
          const item = prodMap.get(c.producerId) || {
            producer: p,
            producerId: c.producerId,
            sabah: 0,
            aksam: 0,
            totalKg: 0,
            unitPrice: uPrice,
            payable: 0
          };
          if (c.shift === 'Sabah') item.sabah += Number(c.amount) || 0;
          else item.aksam += Number(c.amount) || 0;
          item.totalKg = Math.round((item.sabah + item.aksam) * 100) / 100;
          item.payable = Math.round(item.totalKg * item.unitPrice * 100) / 100;
          prodMap.set(c.producerId, item);
        });

        const breakdown = Array.from(prodMap.values()).sort((a, b) => b.payable - a.payable);
        const totalMilkKg = Math.round(breakdown.reduce((s, x) => s + x.totalKg, 0) * 100) / 100;
        const totalPayable = Math.round(breakdown.reduce((s, x) => s + x.payable, 0) * 100) / 100;

        const fallbackAvg = state.producers.length
          ? state.producers.reduce((s, p) => s + (Number(p.unitPrice) || 18), 0) / state.producers.length
          : 18.0;

        const avgMilkPrice = totalMilkKg > 0
          ? Math.round((totalPayable / totalMilkKg) * 1000) / 1000
          : Math.round(fallbackAvg * 1000) / 1000;

        const dayYogurts = state.yogurtBatches.filter(b => b.date === targetDate);
        let fermentedMilk = 0, nCnt = 0, sCnt = 0, k2Cnt = 0, g900Cnt = 0;
        dayYogurts.forEach(b => {
          fermentedMilk += Number(b.fermentedMilkKg) || 0;
          nCnt += Number(b.normalCount) || 0;
          sCnt += Number(b.sertCount) || 0;
          k2Cnt += Number(b.ikiKgCount) || 0;
          g900Cnt += Number(b.dokuzYuzGrCount) || 0;
        });

        const nKg = Math.round(nCnt * 10 * 100) / 100;
        const sKg = Math.round(sCnt * 10 * 100) / 100;
        const k2Kg = Math.round(k2Cnt * 2 * 100) / 100;
        const g900Kg = Math.round(g900Cnt * 0.9 * 100) / 100;
        const totalYogurtKg = Math.round((nKg + sKg + k2Kg + g900Kg) * 100) / 100;

        const hasActualYogurt = totalYogurtKg > 0 && fermentedMilk > 0;
        const actualRatio = hasActualYogurt ? Math.round((fermentedMilk / totalYogurtKg) * 100) / 100 : null;
        const usedRatio = actualRatio !== null ? actualRatio : 3.10;

        const milkCostPerKgYogurt = Math.round(avgMilkPrice * usedRatio * 100) / 100;

        const overheadDaily = Math.round((
          (Number(tariff.dogalgaz) || 0) +
          (Number(tariff.elektrik) || 0) +
          (Number(tariff.mazot) || 0) +
          (Number(tariff.iscilik) || 0) +
          (Number(tariff.yemek) || 0) +
          (Number(tariff.su) || 0)
        ) * 100) / 100;

        const overheadPerKg = totalYogurtKg > 0 ? Math.round((overheadDaily / totalYogurtKg) * 100) / 100 : 0;
        const eur = Number(tariff.euroRate) || 38.0;

        function buildProduct(name, weightKg, count, prodKg, packEur, whPrice, rtPrice) {
          const packTl = Math.round((Number(packEur) || 0) * eur * 100) / 100;
          const milkCost = Math.round(milkCostPerKgYogurt * weightKg * 100) / 100;
          const ovhCost = Math.round(overheadPerKg * weightKg * 100) / 100;
          const unitCost = Math.round((milkCost + ovhCost + packTl) * 100) / 100;

          const wh = Number(whPrice) || 0;
          const rt = Number(rtPrice) || 0;
          const whProfit = Math.round((wh - unitCost) * 100) / 100;
          const rtProfit = Math.round((rt - unitCost) * 100) / 100;
          const whPct = unitCost > 0 ? Math.round((whProfit / unitCost) * 1000) / 10 : 0;
          const rtPct = unitCost > 0 ? Math.round((rtProfit / unitCost) * 1000) / 10 : 0;

          return {
            name, weightKg, count, prodKg, packEur, packTl, milkCost, ovhCost, unitCost,
            wh, whProfit, whPct,
            rt, rtProfit, rtPct,
            batchCost: Math.round(unitCost * count * 100) / 100,
            batchWhRev: Math.round(wh * count * 100) / 100,
            batchRtRev: Math.round(rt * count * 100) / 100
          };
        }

        const products = [
          buildProduct('10 Kg Normal Süzme Yoğurt', 10, nCnt, nKg, tariff.kova10NormalEur, tariff.wholesale10Normal, tariff.retail10Normal),
          buildProduct('10 Kg Sert Süzme Yoğurt', 10, sCnt, sKg, tariff.kova10SertEur, tariff.wholesale10Sert, tariff.retail10Sert),
          buildProduct('2 Kg Süzme Yoğurt', 2, k2Cnt, k2Kg, tariff.kova2Eur, tariff.wholesale2Kg, tariff.retail2Kg),
          buildProduct('900 g Süzme Yoğurt', 0.9, g900Cnt, g900Kg, tariff.kova900Eur, tariff.wholesale900Gr, tariff.retail900Gr)
        ];

        const rawMilkExpense = Math.round(fermentedMilk * avgMilkPrice * 100) / 100;
        const packExpense = Math.round(products.reduce((s, p) => s + p.packTl * p.count, 0) * 100) / 100;
        const grandCost = Math.round((rawMilkExpense + overheadDaily + packExpense) * 100) / 100;
        const grandWhRev = Math.round(products.reduce((s, p) => s + p.batchWhRev, 0) * 100) / 100;
        const grandRtRev = Math.round(products.reduce((s, p) => s + p.batchRtRev, 0) * 100) / 100;

        return {
          tariff,
          breakdown,
          totalMilkKg,
          totalPayable,
          avgMilkPrice,
          fermentedMilk,
          totalYogurtKg,
          actualRatio,
          usedRatio,
          milkCostPerKgYogurt,
          overheadDaily,
          overheadPerKg,
          products,
          grandCost,
          grandWhRev,
          grandRtRev,
          grandWhProfit: Math.round((grandWhRev - grandCost) * 100) / 100,
          grandRtProfit: Math.round((grandRtRev - grandCost) * 100) / 100
        };
      }

      // =========================================================================
      // 6. ÇEVRİMDIŞI QR KOD SVG ÜRETİCİSİ
      // =========================================================================
      function buildQrSvg(code, size) {
        const s = size || 180;
        const n = 21;
        const grid = Array.from({ length: n }, () => Array(n).fill(false));

        function finder(r0, c0) {
          for (let r = 0; r < 7; r++) {
            for (let c = 0; c < 7; c++) {
              const border = r === 0 || r === 6 || c === 0 || c === 6;
              const center = r >= 2 && r <= 4 && c >= 2 && c <= 4;
              grid[r0 + r][c0 + c] = border || center;
            }
          }
        }
        finder(0, 0);
        finder(0, n - 7);
        finder(n - 7, 0);

        let seed = 0;
        const txt = String(code || 'ALAKUZU');
        for (let i = 0; i < txt.length; i++) {
          seed = (seed * 31 + txt.charCodeAt(i)) % 1000003;
        }
        for (let r = 0; r < n; r++) {
          for (let c = 0; c < n; c++) {
            if ((r < 8 && c < 8) || (r < 8 && c >= n - 8) || (r >= n - 8 && c < 8)) continue;
            seed = (seed * 1103515245 + 12345) & 0x7fffffff;
            grid[r][c] = (seed % 100) < 48;
          }
        }

        let rects = `<rect width="21" height="21" fill="#FFFFFF"/>`;
        for (let r = 0; r < n; r++) {
          for (let c = 0; c < n; c++) {
            if (grid[r][c]) {
              rects += `<rect x="${c}" y="${r}" width="1" height="1" fill="#0F294A"/>`;
            }
          }
        }
        return `<svg width="${s}" height="${s}" viewBox="0 0 21 21" shape-rendering="crispEdges" style="border:3px solid #0F294A;border-radius:12px;background:#fff;padding:6px;display:block;margin:0 auto;">${rects}</svg>`;
      }

                      <button type="button" class="quick-add-btn" data-action="quick-add" data-val="0.5">+0.5 kg</button>
                      <button type="button" class="quick-add-btn" data-action="quick-add" data-val="5">+5 kg</button>
                      <button type="button" class="quick-add-btn" data-action="quick-add" data-val="10">+10 kg</button>
                      <button type="button" class="quick-add-btn" data-action="quick-add" data-val="25">+25 kg</button>
                    </div>
                  </div>

                  <label style="display:flex;align-items:center;gap:12px;padding:14px;border-radius:14px;border:2px solid ${state.antibioticWarning ? '#DC2626' : '#CBD5E1'};background:${state.antibioticWarning ? '#FEF2F2' : '#F8FAFC'};cursor:pointer;">
                    <input id="entry-antibiotic" type="checkbox" style="width:24px;height:24px;accent-color:#DC2626;" ${state.antibioticWarning ? 'checked' : ''} />
                    <div>
                      <div style="font-weight:900;font-size:14px;color:${state.antibioticWarning ? '#991B1B' : '#1E293B'};">İğneli / Antibiyotikli Süt (Ayrı Güğüm)</div>
                      <div style="font-size:11.5px;color:#64748B;">Temiz süte karıştırmayınız, merkez uyarılır.</div>

        // MOD 1: MÜŞTERİ BULMA (KAREKOD OKUT + MÜŞTERİ ARA/SEÇ + BUGÜNKÜ LİSTE)
        return topControls + `
          <div class="grid-2" style="margin-bottom:16px;">
            <button type="button" class="big-action-btn btn-primary" data-action="open-qr-scanner">
              📷 KAREKOD OKUT (QR)
            </button>
            <div class="stat-box" style="display:flex;flex-direction:column;justify-content:center;">
              <span class="stat-title">${escHtml(routeObj.plate)} • ${escHtml(state.selectedShift)} Vardiyası Toplamı</span>
              <span class="stat-value" style="color:var(--green);">${fmtKg(shiftSumKg)} kg <small style="font-size:13px;color:#64748B;">(${todayShiftCols.length} teslimat)</small></span>
            </div>
          </div>

          <div class="card">
            <div class="card-header">
              <h3>Müşteri Ara / Seç (${escHtml(routeObj.plate)})</h3>
              <span class="badge badge-amber">${routeProducers.length} Müstahsil</span>
            </div>
            <div class="card-body">
              <div class="form-group" style="margin-bottom:14px;">
                <input id="collector-search-input" type="text" class="form-control" style="font-size:16px;padding:14px;" placeholder="İsim, Cari Kodu veya Mahalle yazarak ara..." value="${escHtml(state.collectorSearch)}" />
              </div>

              ${filteredProducers.length === 0 ? `
                <div style="text-align:center;padding:24px;color:#64748B;font-weight:700;">
                  Bu araç rotasında eşleşen müstahsil bulunamadı.
                </div>
              ` : filteredProducers.map(p => {
                const alreadyToday = todayShiftCols.filter(c => c.producerId === p.id).reduce((s, c) => s + c.amount, 0);
                return `
                  <button type="button" class="producer-select-card" data-action="pick-producer" data-pid="${escHtml(p.id)}">
                    <div style="min-width:0;">
                      <div style="font-size:16px;font-weight:900;color:#0F294A;word-break:break-word;">${escHtml(p.name)}</div>
                      <div style="font-size:12px;color:#64748B;margin-top:2px;">
                        <b>${escHtml(p.village)}</b> • Cari: ${escHtml(p.cariKodu)} • QR: ${escHtml(p.code)}
                      </div>
                      ${alreadyToday > 0 ? `<div style="margin-top:5px;"><span class="badge badge-green">Bu vardiyada girildi: ${fmtKg(alreadyToday)} kg</span></div>` : ''}
                    </div>
                    <span class="btn btn-primary btn-sm" style="flex-shrink:0;">Süt Gir →</span>
                  </button>
                `;
              }).join('')}
            </div>
          </div>

          <div class="card">
            <div class="card-header">
              <h3>${escHtml(state.selectedDate)} (${escHtml(state.selectedShift)}) Girilen Kayıtlar</h3>
            </div>
            <div class="table-wrap">
              <table>
                <thead>
                  <tr>
                    <th>Müstahsil</th>
                    <th>Mahalle</th>
                    <th class="text-right">Miktar (Kg)</th>
                    <th class="text-center">Durum</th>
                    <th class="text-center">İşlem</th>
                  </tr>
                </thead>
                <tbody>
                  ${todayShiftCols.length === 0 ? `
                    <tr><td colspan="5" class="text-center" style="padding:20px;color:#64748B;font-weight:700;">Henüz süt girişi yapılmadı.</td></tr>
                  ` : todayShiftCols.map(c => {
                    const p = getProducer(c.producerId);
                    return `
                      <tr>
                        <td><strong>${escHtml(p ? p.name : 'Bilinmeyen')}</strong></td>
                        <td>${escHtml(p ? p.village : '-')}</td>
                        <td class="text-right" style="font-weight:900;color:#0F294A;">${fmtKg(c.amount)} kg</td>
                        <td class="text-center">
                          ${c.antibioticWarning ? `<span class="badge badge-red">Ayrı Güğüm!</span>` : `<span class="badge badge-green">Temiz</span>`}
                        </td>
                        <td class="text-center">
                          <button type="button" class="btn btn-outline btn-sm" data-action="edit-col" data-cid="${escHtml(c.id)}">Düzenle</button>
                          <button type="button" class="btn btn-danger btn-sm" data-action="del-col" data-cid="${escHtml(c.id)}">Sil</button>
                        </td>
                      </tr>
                    `;
                  }).join('')}
                </tbody>
              </table>
            </div>
          </div>
        `;
      }

      // =========================================================================
      // 9. MERKEZ KANTAR & FARK KONTROLÜ SEKMESİ (DEPOCU & ADMIN - TL GİZLİ)
      // =========================================================================
      function renderCenterTab() {
        const isAdmin = state.currentUser.role === 'admin';
        const isLocked = !isAdmin && state.selectedDate !== TODAY_STR;
        const routeObj = getRoute(state.selectedRoute);

        const shiftCols = state.collections.filter(
          c => c.date === state.selectedDate && c.shift === state.selectedShift && c.routeId === state.selectedRoute
        );
        const fieldTotal = Math.round(shiftCols.reduce((s, c) => s + (Number(c.amount) || 0), 0) * 100) / 100;
        const antiCount = shiftCols.filter(c => c.antibioticWarning).length;

        const wId = `w-${state.selectedDate}-${state.selectedShift}-${state.selectedRoute}`;
        const existingW = state.weighings.find(w => w.id === wId);
        const centerVal = existingW ? existingW.centerWeight : '';
        const noteVal = existingW ? existingW.note : '';

        const hasCenter = existingW && existingW.centerWeight !== '' && !isNaN(Number(existingW.centerWeight));
        const diff = hasCenter ? Math.round((Number(existingW.centerWeight) - fieldTotal) * 100) / 100 : null;
        const isCritical = diff !== null && Math.abs(diff) > 2;

        return `
          <div class="card">
            <div class="card-body">
              <div class="grid-3">
                <div class="form-group">
                  <label class="form-label">Tarih ${!isAdmin ? '(Bugüne Kilitli)' : ''}</label>
                  ${isAdmin ? `
                    <input id="center-date-input" type="date" class="form-control" value="${escHtml(state.selectedDate)}" />
                  ` : `
                    <div class="form-control" style="background:#E2E8F0;">${TODAY_STR} (Bugün)</div>
                  `}
                </div>
                <div class="form-group">
                  <label class="form-label">Vardiya</label>
                  <div class="shift-toggle">
                    <button type="button" class="shift-btn ${state.selectedShift === 'Sabah' ? 'active-sabah' : ''}" data-action="set-shift" data-shift="Sabah">SABAH</button>
                    <button type="button" class="shift-btn ${state.selectedShift === 'Akşam' ? 'active-aksam' : ''}" data-action="set-shift" data-shift="Akşam">AKŞAM</button>
                  </div>
                </div>
                <div class="form-group">
                  <label class="form-label">Araç Plakası</label>
                  <select id="center-route-select" class="form-control">
                    ${state.routes.map(r => `<option value="${escHtml(r.id)}" ${r.id === state.selectedRoute ? 'selected' : ''}>${escHtml(r.plate)} — ${escHtml(r.name)}</option>`).join('')}
                  </select>
                </div>
              </div>
            </div>
          </div>

          ${isLocked ? `
            <div class="alert-banner alert-danger">
              <span>Depocu yalnızca BUGÜNÜN (${TODAY_STR}) kantar tartımını girebilir!</span>
              <button type="button" class="btn btn-outline btn-sm" data-action="reset-today">Bugüne Dön</button>
            </div>
          ` : ''}

          ${antiCount > 0 ? `
            <div class="alert-banner alert-warning">
              <span>⚠️ DİKKAT: Bu seferde ${antiCount} müstahsilde "İğneli / Antibiyotikli Süt (Ayrı Güğüm)" işareti var!</span>
            </div>
          ` : ''}

          ${isCritical ? `
            <div class="alert-banner alert-danger">
              <span>🚨 FİRE / EKSİK UYARISI: Saha toplamı (${fmtKg(fieldTotal)} kg) ile Merkez Kantar (${fmtKg(existingW.centerWeight)} kg) arasında ${fmtKg(diff)} kg fark var!</span>
            </div>
          ` : ''}

          <div class="grid-3" style="margin-bottom:16px;">
            <div class="stat-box">
              <span class="stat-title">Saha Toplayıcı Toplamı</span>
              <span class="stat-value">${fmtKg(fieldTotal)} kg</span>
              <div style="font-size:11px;color:#64748B;margin-top:4px;">${shiftCols.length} müstahsil (Salt Okunur)</div>
            </div>
            <div class="stat-box">
              <span class="stat-title">Merkez Kantar Tartımı</span>
              <span class="stat-value" style="color:var(--green);">${hasCenter ? fmtKg(existingW.centerWeight) + ' kg' : 'Girilmedi'}</span>
              <div style="font-size:11px;color:#64748B;margin-top:4px;">${escHtml(routeObj.plate)} • ${escHtml(state.selectedShift)}</div>
            </div>
            <div class="stat-box" style="${isCritical ? 'background:#FEF2F2;border-color:#DC2626;' : ''}">
              <span class="stat-title">Litre / Kilo Farkı</span>
              <span class="stat-value" style="color:${diff === null ? '#64748B' : isCritical ? '#DC2626' : '#059669'};">
                ${diff === null ? '—' : (diff > 0 ? '+' : '') + fmtKg(diff) + ' kg'}
              </span>
              <div style="font-size:11px;color:#64748B;margin-top:4px;">Tolerans sınırı: ±2,0 kg</div>
            </div>
          </div>

          <div class="grid-2">
            <div class="card">
              <div class="card-header">
                <h3>Merkez Kantar Tartımı Gir (${escHtml(routeObj.plate)})</h3>
              </div>
              <div class="card-body">
                <form id="weighing-form" style="display:flex;flex-direction:column;gap:14px;">
                  <div class="form-group">
                    <label class="form-label">Araçtan Alınan Toplam Süt (Kg) *</label>
                    <input id="center-weight-input" type="number" step="0.1" min="0" class="huge-milk-input" style="font-size:28px;" placeholder="Örn: 600" value="${escHtml(centerVal)}" ${isLocked ? 'disabled' : ''} required />
                  </div>
                  <div class="form-group">
                    <label class="form-label">Fark / Fire Müdahale Notu</label>
                    <textarea id="center-note-input" rows="3" class="form-control" placeholder="Eksik veya fazla çıkma nedenini not alınız..." ${isLocked ? 'disabled' : ''}>${escHtml(noteVal)}</textarea>
                  </div>
                  <button type="submit" class="btn btn-primary btn-block" style="padding:14px;font-size:14px;" ${isLocked ? 'disabled' : ''}>
                    KANTAR TARTIMINI KAYDET
                  </button>
                </form>
              </div>
            </div>

            <div class="card">
              <div class="card-header">
                <h3>Sahadan Gelen Müstahsil Listesi (Salt Okunur)</h3>
              </div>
              <div class="table-wrap">
                <table>
                  <thead>
                    <tr>
                      <th>Müstahsil</th>
                      <th>Mahalle</th>
                      <th class="text-right">Süt (Kg)</th>
                      <th class="text-center">Güğüm</th>
                    </tr>
                  </thead>
                  <tbody>
                    ${shiftCols.length === 0 ? `
                      <tr><td colspan="4" class="text-center" style="padding:20px;color:#64748B;">Bu sefer için saha girişi yok.</td></tr>
                    ` : shiftCols.map(c => {
                      const p = getProducer(c.producerId);
                      return `
                        <tr>
                          <td><strong>${escHtml(p ? p.name : '-')}</strong></td>
                          <td>${escHtml(p ? p.village : '-')}</td>
                          <td class="text-right"><strong>${fmtKg(c.amount)} kg</strong></td>
                          <td class="text-center">${c.antibioticWarning ? '<span class="badge badge-red">İlaçlı/Ayrı</span>' : '<span class="badge badge-green">Normal</span>'}</td>
                        </tr>
                      `;
                    }).join('')}
                  </tbody>
                </table>
              </div>
            </div>
          </div>
        `;
      }

      // =========================================================================
      // 10. SÜZME YOĞURT ÜRETİM & MAYALAMA SEKMESİ (DEPOCU & ADMIN - TL GİZLİ)
      // =========================================================================
      function renderYogurtTab() {
        const isAdmin = state.currentUser.role === 'admin';
        const isLocked = !isAdmin && state.yogurtDate !== TODAY_STR;
        const stock = getDepotStock();

        const batchId = `yog-${state.yogurtDate}-${state.yogurtShift}`;
        const existing = state.yogurtBatches.find(b => b.id === batchId);
        const maxAllowed = Math.round((stock.remaining + (existing ? Number(existing.fermentedMilkKg) : 0)) * 100) / 100;

        const dayBatches = state.yogurtBatches.filter(b => b.date === state.yogurtDate);
        const dayFerm = dayBatches.reduce((s, b) => s + (Number(b.fermentedMilkKg) || 0), 0);
        const dayYog = dayBatches.reduce((s, b) => {
          return s + (b.normalCount * 10) + (b.sertCount * 10) + (b.ikiKgCount * 2) + (b.dokuzYuzGrCount * 0.9);
        }, 0);
        const dayRatio = dayYog > 0 && dayFerm > 0 ? Math.round((dayFerm / dayYog) * 100) / 100 : null;
        const dayHighWarn = dayRatio !== null && dayRatio > STRAINED_LIMIT;

        return `
          ${isLocked ? `
            <div class="alert-banner alert-danger">
              <span>Depocu yalnızca BUGÜNÜN (${TODAY_STR}) tarihine mayalama/üretim girebilir!</span>
              <button type="button" class="btn btn-outline btn-sm" data-action="reset-yogurt-today">Bugüne Dön</button>
            </div>
          ` : ''}

          <div class="grid-4" style="margin-bottom:16px;">
            <div class="stat-box" style="background:var(--navy);color:#fff;">
              <span class="stat-title" style="color:#FCD34D;">Depoda Kalan Çiğ Süt</span>
              <span class="stat-value" style="color:#fff;">${fmtKg(stock.remaining)} kg</span>
              <div style="font-size:11px;color:#CBD5E1;margin-top:4px;">Mayalamaya hazır stok</div>
            </div>
            <div class="stat-box">
              <span class="stat-title">Seçili Gün Mayalanan</span>
              <span class="stat-value">${fmtKg(dayFerm)} kg</span>
              <div style="font-size:11px;color:#64748B;margin-top:4px;">${escHtml(state.yogurtDate)} toplamı</div>
            </div>
            <div class="stat-box">
              <span class="stat-title">Çıkan Süzme Yoğurt</span>
              <span class="stat-value" style="color:var(--green);">${fmtKg(dayYog)} kg</span>
              <div style="font-size:11px;color:#64748B;margin-top:4px;">4 çeşit toplamı</div>
            </div>
            <div class="stat-box" style="${dayHighWarn ? 'background:#DC2626;color:#fff;border-color:#991B1B;' : ''}">
              <span class="stat-title" style="${dayHighWarn ? 'color:#FEF2F2;' : ''}">Süzme Oranı (Sınır: ≤ 3,20)</span>
              <span class="stat-value" style="${dayHighWarn ? 'color:#fff;' : ''}">${dayRatio !== null ? fmtRatio(dayRatio) : '—'}</span>
              <div style="font-size:11px;font-weight:800;margin-top:4px;color:${dayHighWarn ? '#FCD34D' : '#059669'};">
                ${dayRatio === null ? 'Üretim bekleniyor' : dayHighWarn ? 'DİKKAT: 3,20 ÜZERİNDE!' : 'İdeal Oran'}
              </div>
            </div>
          </div>

          <div class="card">
            <div class="card-header">
              <h3>Süzme Yoğurt Mayalama & Üretim Girişi</h3>
              <span class="badge badge-amber">${escHtml(state.yogurtDate)} • ${escHtml(state.yogurtShift)}</span>
            </div>
            <div class="card-body">
              <form id="yogurt-form" style="display:flex;flex-direction:column;gap:14px;">
                <div class="grid-2">
                  <div class="form-group">
                    <label class="form-label">Üretim Tarihi ${!isAdmin ? '(Bugüne Kilitli)' : ''}</label>
                    ${isAdmin ? `
                      <input id="yog-date-input" type="date" class="form-control" value="${escHtml(state.yogurtDate)}" />
                    ` : `
                      <div class="form-control" style="background:#E2E8F0;">${TODAY_STR} (Bugün)</div>
                    `}
                  </div>
                  <div class="form-group">
                    <label class="form-label">Üretim Vardiyası (Sabah / Akşam)</label>
                    <div class="shift-toggle">
                      <button type="button" class="shift-btn ${state.yogurtShift === 'Sabah' ? 'active-sabah' : ''}" data-action="set-yog-shift" data-shift="Sabah">SABAH</button>
                      <button type="button" class="shift-btn ${state.yogurtShift === 'Akşam' ? 'active-aksam' : ''}" data-action="set-yog-shift" data-shift="Akşam">AKŞAM</button>
                    </div>
                  </div>
                </div>

                <div class="form-group" style="background:#EFF6FF;padding:14px;border-radius:14px;border:1.5px solid #93C5FD;">
                  <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:6px;">
                    <label class="form-label" style="color:var(--navy);font-size:12px;">Mayalanacak Çiğ Süt (Kg) *</label>
                    <span class="badge badge-green">Kullanılabilir Maksimum Stok: ${fmtKg(maxAllowed)} kg</span>
                  </div>
                  <input id="yog-fermented" type="number" step="0.1" min="0" max="${maxAllowed}" class="huge-milk-input" style="font-size:26px;" placeholder="Örn: 600" value="${existing ? escHtml(existing.fermentedMilkKg) : ''}" ${isLocked ? 'disabled' : ''} required />
                </div>

                <div class="grid-4">
                  <div class="form-group" style="background:#F8FAFC;padding:12px;border-radius:12px;border:1px solid #CBD5E1;">
                    <label class="form-label">Normal Yoğurt (Adet × 10 kg)</label>
                    <input id="yog-normal" type="number" min="0" step="1" class="form-control" value="${existing ? escHtml(existing.normalCount) : '0'}" ${isLocked ? 'disabled' : ''} />
                  </div>
                  <div class="form-group" style="background:#F8FAFC;padding:12px;border-radius:12px;border:1px solid #CBD5E1;">
                    <label class="form-label">Sert Yoğurt (Adet × 10 kg)</label>
                    <input id="yog-sert" type="number" min="0" step="1" class="form-control" value="${existing ? escHtml(existing.sertCount) : '0'}" ${isLocked ? 'disabled' : ''} />
                  </div>
                  <div class="form-group" style="background:#F8FAFC;padding:12px;border-radius:12px;border:1px solid #CBD5E1;">
                    <label class="form-label">2 Kg Yoğurt (Adet × 2 kg)</label>
                    <input id="yog-2kg" type="number" min="0" step="1" class="form-control" value="${existing ? escHtml(existing.ikiKgCount) : '0'}" ${isLocked ? 'disabled' : ''} />
                  </div>
                  <div class="form-group" style="background:#F8FAFC;padding:12px;border-radius:12px;border:1px solid #CBD5E1;">
                    <label class="form-label">900 g Yoğurt (Adet × 0,9 kg)</label>
                    <input id="yog-900g" type="number" min="0" step="1" class="form-control" value="${existing ? escHtml(existing.dokuzYuzGrCount) : '0'}" ${isLocked ? 'disabled' : ''} />
                  </div>
                </div>

                <div class="form-group">
                  <label class="form-label">Üretim / Süzme Notu</label>
                  <input id="yog-note" type="text" class="form-control" placeholder="Süzme süresi, kıvam veya fire notu..." value="${existing ? escHtml(existing.note || '') : ''}" ${isLocked ? 'disabled' : ''} />
                </div>

                <button type="submit" class="btn btn-success btn-block" style="padding:14px;font-size:15px;" ${isLocked ? 'disabled' : ''}>
                  ${escHtml(state.yogurtShift).toUpperCase()} VARDİYASI ÜRETİMİNİ KAYDET
                </button>
              </form>
            </div>
          </div>

          <div class="card">
            <div class="card-header">
              <h3>Üretim Kayıtları (${escHtml(state.yogurtDate)})</h3>
            </div>
            <div class="table-wrap">
              <table>
                <thead>
                  <tr>
                    <th>Vardiya</th>
                    <th class="text-right">Mayalanan Süt</th>
                    <th class="text-right">Normal (10kg)</th>
                    <th class="text-right">Sert (10kg)</th>
                    <th class="text-right">2 Kg</th>
                    <th class="text-right">900 g</th>
                    <th class="text-right">Toplam Yoğurt</th>
                    <th class="text-center">Süzme Oranı (≤3,20)</th>
                    <th class="text-center">İşlem</th>
                  </tr>
                </thead>
                <tbody>
                  ${dayBatches.length === 0 ? `
                    <tr><td colspan="9" class="text-center" style="padding:20px;color:#64748B;">Bu tarihte süzme yoğurt üretimi girilmemiş.</td></tr>
                  ` : dayBatches.map(b => {
                    const totY = Math.round(((b.normalCount * 10) + (b.sertCount * 10) + (b.ikiKgCount * 2) + (b.dokuzYuzGrCount * 0.9)) * 100) / 100;
                    const ratio = totY > 0 ? Math.round((b.fermentedMilkKg / totY) * 100) / 100 : 0;
                    const high = ratio > STRAINED_LIMIT;
                    return `
                      <tr style="${high ? 'background:#FEF2F2;' : ''}">
                        <td><strong>${escHtml(b.shift)}</strong></td>
                        <td class="text-right"><strong>${fmtKg(b.fermentedMilkKg)} kg</strong></td>
                        <td class="text-right">${b.normalCount} ad (${fmtKg(b.normalCount * 10)} kg)</td>
                        <td class="text-right">${b.sertCount} ad (${fmtKg(b.sertCount * 10)} kg)</td>
                        <td class="text-right">${b.ikiKgCount} ad (${fmtKg(b.ikiKgCount * 2)} kg)</td>
                        <td class="text-right">${b.dokuzYuzGrCount} ad (${fmtKg(b.dokuzYuzGrCount * 0.9)} kg)</td>
                        <td class="text-right" style="font-weight:900;color:var(--green);">${fmtKg(totY)} kg</td>
                        <td class="text-center">

      // =========================================================================
      // 12. DİJİTAL MÜSTAHSİL KARTI & QR ETİKET SEKMESİ
      // =========================================================================
      function renderCardTab() {
        const user = state.currentUser;
        const accessible = user.role === 'collector' && user.assignedRouteId
          ? state.producers.filter(p => p.routeId === user.assignedRouteId)
          : state.producers;

        if (accessible.length === 0) {
          return `<div class="card"><div class="card-body">Tanımlı müstahsil bulunamadı.</div></div>`;
        }

        if (!accessible.some(p => p.id === state.cardProducerId)) {
          state.cardProducerId = accessible[0].id;
        }

        const prod = accessible.find(p => p.id === state.cardProducerId) || accessible[0];
        const rObj = getRoute(prod.routeId);

        let sumSabah = 0, sumAksam = 0;
        const dayRows = [];
        for (let d = 1; d <= 31; d++) {
          const dd = String(d).padStart(2, '0');
          const fullDate = `${state.cardMonth}-${dd}`;
          const cols = state.collections.filter(c => c.producerId === prod.id && c.date === fullDate);
          const s = cols.filter(c => c.shift === 'Sabah').reduce((a, b) => a + b.amount, 0);
          const a = cols.filter(c => c.shift === 'Akşam').reduce((a, b) => a + b.amount, 0);
          sumSabah += s;
          sumAksam += a;
          dayRows.push({ d, s, a, warn: cols.some(c => c.antibioticWarning) });
        }

        const grandTotal = Math.round((sumSabah + sumAksam) * 100) / 100;
        const totalMoney = Math.round(grandTotal * (Number(prod.unitPrice) || 18) * 100) / 100;

        function halfTable(slice) {
          return `
            <table>
              <thead>
                <tr>
                  <th>GÜN</th>
                  <th>SABAH (KG)</th>
                  <th>AKŞAM (KG)</th>
                  <th>TOPLAM</th>
                </tr>
              </thead>
              <tbody>
                ${slice.map(r => {
                  const tot = Math.round((r.s + r.a) * 100) / 100;
                  return `
                    <tr>
                      <td style="background:#E6C27A;"><strong>${r.d}</strong></td>
                      <td>${r.s > 0 ? fmtKg(r.s) : ''}</td>
                      <td>${r.a > 0 ? fmtKg(r.a) : ''}</td>
                      <td>${tot > 0 ? fmtKg(tot) : ''} ${r.warn ? '⚠️' : ''}</td>
                    </tr>
                  `;
                }).join('')}
              </tbody>
            </table>
          `;
        }

        return `
          <div class="card no-print">
            <div class="card-body">
              <div class="grid-3">
                <div class="form-group">
                  <label class="form-label">Müstahsil Seçimi</label>
                  <select id="card-prod-select" class="form-control">
                    ${accessible.map(p => `<option value="${escHtml(p.id)}" ${p.id === prod.id ? 'selected' : ''}>${escHtml(p.name)} (${escHtml(p.village)})</option>`).join('')}
                  </select>
                </div>
                <div class="form-group">
                  <label class="form-label">Dönem (Ay)</label>
                  <input id="card-month-input" type="month" class="form-control" value="${escHtml(state.cardMonth)}" />
                </div>
                <div class="form-group" style="justify-content:flex-end;">
                  <div style="display:flex;gap:8px;flex-wrap:wrap;">
                    <button type="button" class="btn btn-amber" data-action="open-qr-label" data-pid="${escHtml(prod.id)}">QR Etiketi</button>
                    <button type="button" class="btn btn-primary" onclick="window.print()">Yazdır</button>
                  </div>
                </div>
              </div>
            </div>
          </div>

          <div class="physical-card">
            <div style="display:flex;justify-content:space-between;align-items:flex-start;flex-wrap:wrap;gap:14px;border-bottom:2px solid var(--card-border);padding-bottom:14px;margin-bottom:14px;">
              <div>
                <div style="font-size:20px;font-weight:900;color:#0F294A;">ALAKUZULAR GIDA İHTİYAÇ MAD. NAK. TARIM LTD. ŞTİ.</div>
                <div style="font-size:13px;font-weight:800;margin-top:4px;">MÜSTAHSİL SÜT TOPLAMA KARTI — DÖNEM: ${escHtml(state.cardMonth)}</div>
                <div style="margin-top:8px;font-size:14px;">
                  <strong>Adı Soyadı:</strong> ${escHtml(prod.name)} &nbsp;|&nbsp;
                  <strong>Cari Kodu:</strong> ${escHtml(prod.cariKodu)} &nbsp;|&nbsp;
                  <strong>Mahalle:</strong> ${escHtml(prod.village)} (${escHtml(rObj.plate)})
                </div>
                <div style="margin-top:6px;font-size:12px;background:#FEF2F2;border:1px solid #DC2626;color:#991B1B;padding:6px 10px;border-radius:8px;font-weight:800;">
                  DİKKAT: İĞNELİ VE ANTİBİYOTİKLİ SÜTLERİ TEMİZ SÜTE KARIŞTIRMAYINIZ!
                </div>
              </div>
              <div style="text-align:center;">
                ${buildQrSvg(prod.code, 105)}
                <div style="font-family:monospace;font-size:11px;font-weight:900;margin-top:4px;">${escHtml(prod.code)}</div>
              </div>
            </div>

            <div class="grid-2">
              <div>${halfTable(dayRows.slice(0, 15))}</div>
              <div>${halfTable(dayRows.slice(15, 31))}</div>
            </div>

            <div style="margin-top:14px;padding:12px 16px;background:#0F294A;color:#fff;border-radius:12px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;">
              <div>Sabah: <b>${fmtKg(sumSabah)} kg</b> • Akşam: <b>${fmtKg(sumAksam)} kg</b></div>
              <div style="font-size:18px;font-weight:900;color:#FCD34D;">AYLIK TOPLAM: ${fmtKg(grandTotal)} KG</div>
              ${user.role === 'admin' ? `<div style="font-size:15px;font-weight:900;color:#6EE7B7;">HAKEDİŞ: ${fmtMoney(totalMoney)}</div>` : ''}
            </div>
          </div>
        `;
      }

      // =========================================================================
      // 14. TOPLU RAPOR & FİLTRELEME / SIRALAMA / CSV İNDİRME (SADECE ADMIN)
      // =========================================================================
      function renderReportsTab() {
        const districts = Array.from(new Set(state.producers.map(p => p.district).filter(Boolean))).sort();
        const villages = Array.from(new Set(
          state.producers
            .filter(p => state.repDistrict === 'ALL' || p.district === state.repDistrict)
            .map(p => p.village)
            .filter(Boolean)
        )).sort();

        const q = state.repSearch.trim().toLowerCase();
        const rows = state.producers
          .filter(p => {
            if (state.repRoute !== 'ALL' && p.routeId !== state.repRoute) return false;
            if (state.repDistrict !== 'ALL' && p.district !== state.repDistrict) return false;
            if (state.repVillage !== 'ALL' && p.village !== state.repVillage) return false;
            if (q) {
              const hit = p.name.toLowerCase().includes(q) ||
                (p.cariKodu && p.cariKodu.toLowerCase().includes(q)) ||
                (p.tc && p.tc.includes(q));
              if (!hit) return false;
            }
            return true;
          })
          .map(p => {
            const cols = state.collections.filter(c => {
              if (c.producerId !== p.id) return false;
              if (state.repStart && c.date < state.repStart) return false;
              if (state.repEnd && c.date > state.repEnd) return false;
              return true;
            });
            const sabah = cols.filter(c => c.shift === 'Sabah').reduce((s, c) => s + c.amount, 0);
            const aksam = cols.filter(c => c.shift === 'Akşam').reduce((s, c) => s + c.amount, 0);
            const totalMilk = Math.round((sabah + aksam) * 100) / 100;
            const payable = Math.round(totalMilk * (Number(p.unitPrice) || 18) * 100) / 100;
            return { ...p, route: getRoute(p.routeId), sabah, aksam, totalMilk, payable };
          })
          .filter(r => !state.repOnlyMilk || r.totalMilk > 0);

        rows.sort((a, b) => {
          let cmp = 0;
          if (state.repSortField === 'totalMilk') cmp = a.totalMilk - b.totalMilk;
          else if (state.repSortField === 'payable') cmp = a.payable - b.payable;
          else if (state.repSortField === 'name') cmp = a.name.localeCompare(b.name, 'tr');
          else if (state.repSortField === 'cariKodu') cmp = (a.cariKodu || '').localeCompare(b.cariKodu || '', 'tr');
          return state.repSortDir === 'desc' ? -cmp : cmp;
        });

        const sumTotalMilk = Math.round(rows.reduce((s, r) => s + r.totalMilk, 0) * 100) / 100;
        const sumPayable = Math.round(rows.reduce((s, r) => s + r.payable, 0) * 100) / 100;

        return `
          <div class="card no-print">
            <div class="card-header">
              <h3>Toplu Rapor & Filtreleme (Tarih Sınırı Yok)</h3>
              <div style="display:flex;gap:8px;">
                <button type="button" class="btn btn-success btn-sm" data-action="export-csv">Excel (CSV) İndir</button>
                <button type="button" class="btn btn-amber btn-sm" onclick="window.print()">Yazdır</button>
              </div>
            </div>
            <div class="card-body">
              <div class="grid-3" style="margin-bottom:12px;">
                <div class="form-group"><label class="form-label">Başlangıç Tarihi</label><input id="rep-start" type="date" class="form-control" value="${escHtml(state.repStart)}" /></div>
                <div class="form-group"><label class="form-label">Bitiş Tarihi</label><input id="rep-end" type="date" class="form-control" value="${escHtml(state.repEnd)}" /></div>
                <div class="form-group">
                  <label class="form-label">Araç Plakası</label>
                  <select id="rep-route" class="form-control">
                    <option value="ALL">Tüm Plakalar</option>
                    ${state.routes.map(r => `<option value="${escHtml(r.id)}" ${r.id === state.repRoute ? 'selected' : ''}>${escHtml(r.plate)}</option>`).join('')}
                  </select>
                </div>
              </div>
              <div class="grid-4">
                <div class="form-group">
                  <label class="form-label">İlçe</label>
                  <select id="rep-dist" class="form-control">
                    <option value="ALL">Tüm İlçeler</option>
                    ${districts.map(d => `<option value="${escHtml(d)}" ${d === state.repDistrict ? 'selected' : ''}>${escHtml(d)}</option>`).join('')}
                  </select>
                </div>
                <div class="form-group">
                  <label class="form-label">Mahalle</label>
                  <select id="rep-vil" class="form-control">
                    <option value="ALL">Tüm Mahalleler</option>
                    ${villages.map(v => `<option value="${escHtml(v)}" ${v === state.repVillage ? 'selected' : ''}>${escHtml(v)}</option>`).join('')}
                  </select>
                </div>
                <div class="form-group">
                  <label class="form-label">Müstahsil Ara</label>
                  <input id="rep-search" type="text" class="form-control" placeholder="Ad, Cari Kod, T.C..." value="${escHtml(state.repSearch)}" />
                </div>
                <div class="form-group">
                  <label class="form-label">Sıralama</label>
                  <select id="rep-sort" class="form-control">
                    <option value="totalMilk-desc" ${state.repSortField === 'totalMilk' && state.repSortDir === 'desc' ? 'selected' : ''}>Toplam Süt (Büyükten Küçüğe)</option>
                    <option value="totalMilk-asc" ${state.repSortField === 'totalMilk' && state.repSortDir === 'asc' ? 'selected' : ''}>Toplam Süt (Küçükten Büyüğe)</option>
                    <option value="payable-desc" ${state.repSortField === 'payable' && state.repSortDir === 'desc' ? 'selected' : ''}>Hakediş Tutarı (Büyükten Küçüğe)</option>
                    <option value="name-asc" ${state.repSortField === 'name' && state.repSortDir === 'asc' ? 'selected' : ''}>İsim (A - Z)</option>
                  </select>
                </div>
              </div>
              <label style="display:inline-flex;align-items:center;gap:8px;margin-top:12px;font-size:12.5px;font-weight:700;cursor:pointer;">
                <input id="rep-only-milk" type="checkbox" ${state.repOnlyMilk ? 'checked' : ''} />
                <span>Sadece seçili aralıkta süt teslimatı olan müstahsilleri göster</span>
              </label>
            </div>
          </div>

          <div class="card">
            <div class="card-header">
              <h3>Müstahsil Süt & Hakediş Toplu Dökümü (${rows.length} Müstahsil)</h3>
              <span class="badge badge-amber">Toplam: ${fmtKg(sumTotalMilk)} kg • ${fmtMoney(sumPayable)}</span>
            </div>
            <div class="table-wrap">
              <table>
                <thead>
                  <tr>
                    <th>Cari Kodu</th>
                    <th>Adı Soyadı</th>
                    <th>İlçe / Mahalle</th>
                    <th>Plaka</th>
                    <th class="text-right">Sabah (Kg)</th>
                    <th class="text-right">Akşam (Kg)</th>
                    <th class="text-right">Toplam Süt (Kg)</th>
                    <th class="text-right">Birim Fiyat</th>
                    <th class="text-right">Toplam Hakediş</th>
                  </tr>
                </thead>
                <tbody>
                  ${rows.map(r => `
                    <tr>
                      <td><strong>${escHtml(r.cariKodu)}</strong></td>
                      <td><strong>${escHtml(r.name)}</strong></td>
                      <td>${escHtml(r.district)} / ${escHtml(r.village)}</td>
                      <td><span class="badge badge-navy">${escHtml(r.route.plate)}</span></td>
                      <td class="text-right">${fmtKg(r.sabah)}</td>
                      <td class="text-right">${fmtKg(r.aksam)}</td>
                      <td class="text-right"><strong>${fmtKg(r.totalMilk)} kg</strong></td>
                      <td class="text-right">${fmtMoney(r.unitPrice)}</td>
                      <td class="text-right" style="font-weight:900;color:var(--green);">${fmtMoney(r.payable)}</td>
                    </tr>
                  `).join('')}
                </tbody>
              </table>
            </div>
          </div>
        `;
      }

                    <button type="submit" class="btn btn-primary">Bul</button>
                  </form>

                  <div style="background:#FFFBEB;border:1.5px solid #F59E0B;border-radius:12px;padding:10px;">
