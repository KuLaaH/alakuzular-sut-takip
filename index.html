      // =========================================================================
      // 16. ANA RENDER FONKSİYONU
      // =========================================================================
      function render() {
        const root = document.getElementById('app');
        if (!root) return;

        let contentHtml = '';
        if (!state.currentUser) {
          contentHtml = renderLogin();
        } else {
          const u = state.currentUser;
          const isAdmin = u.role === 'admin';
          const isCollector = u.role === 'collector';
          const isWarehouse = u.role === 'warehouse';
          const stock = getDepotStock();

          let roleBadge = '';
          if (isAdmin) roleBadge = `<span class="badge badge-purple">ADMIN</span>`;
          if (isCollector) roleBadge = `<span class="badge badge-amber">TOPLAYICI • ${escHtml(getRoute(u.assignedRouteId).plate)}</span>`;
          if (isWarehouse) roleBadge = `<span class="badge badge-green">DEPOCU / ÜRETİM</span>`;

          const tabs = [];
          if (isAdmin) tabs.push({ id: 'admin', label: 'Yönetim & Kayıt' });
          if (isAdmin || isCollector) tabs.push({ id: 'collector', label: 'Saha Süt Toplama' });
          if (isAdmin || isWarehouse) tabs.push({ id: 'center', label: 'Merkez Kantar & Fark' });
          if (isAdmin || isWarehouse) tabs.push({ id: 'yogurt', label: 'Süzme Yoğurt Üretim' });
          if (isAdmin) tabs.push({ id: 'cost', label: 'Maliyet & Kâr Analizi' });
          if (isAdmin || isCollector) tabs.push({ id: 'card', label: 'Dijital Müstahsil Kartı' });
          if (isAdmin) tabs.push({ id: 'reports', label: 'Toplu Rapor' });

          if (!tabs.some(t => t.id === state.activeTab) && tabs.length > 0) {
            state.activeTab = tabs[0].id;
          }

          let tabBody = '';
          if (state.activeTab === 'collector') tabBody = renderCollectorTab();
          else if (state.activeTab === 'center') tabBody = renderCenterTab();
          else if (state.activeTab === 'yogurt') tabBody = renderYogurtTab();
          else if (state.activeTab === 'cost') tabBody = renderCostTab();
          else if (state.activeTab === 'card') tabBody = renderCardTab();
          else if (state.activeTab === 'admin') tabBody = renderAdminTab();
          else if (state.activeTab === 'reports') tabBody = renderReportsTab();

          contentHtml = `
            <header class="topbar">
              <div class="topbar-inner">
                <div>
                  <div class="brand-title">ALAKUZULAR GIDA ${roleBadge}</div>
                  <div class="brand-sub">${escHtml(u.name)} • Bugün: <b>${TODAY_STR}</b></div>
                </div>
                <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;">
                  ${(isAdmin || isWarehouse) ? `
                    <span class="badge badge-amber" style="padding:6px 12px;font-size:12px;">
                      Depo Çiğ Süt: ${fmtKg(stock.remaining)} kg
                    </span>
                  ` : ''}
                  ${isAdmin ? `<button type="button" class="btn btn-outline btn-sm" data-action="reset-demo">Verileri Sıfırla</button>` : ''}
                  <button type="button" class="btn btn-danger btn-sm" data-action="logout">Çıkış / Rol Değiştir</button>
                </div>
              </div>
              <nav class="nav-bar">
                <div class="nav-inner">
                  ${tabs.map(t => `
                    <button type="button" class="nav-btn ${state.activeTab === t.id ? 'active' : ''}" data-action="switch-tab" data-tab="${t.id}">
                      ${escHtml(t.label)}
                    </button>
                  `).join('')}
                </div>
              </nav>
            </header>

            <main class="container" style="padding-top:18px;">
              ${tabBody}
            </main>
          `;
        }

        const toastHtml = state.toast ? `
          <div class="toast-box" style="background:${state.toast.type === 'error' ? '#DC2626' : '#059669'};">
            ${escHtml(state.toast.msg)}
          </div>
        ` : '';

        const flashHtml = state.flashOverlay ? `
          <div class="save-flash">
            <div style="font-size:48px;margin-bottom:8px;">✓</div>
            <h2 style="font-size:32px;font-weight:900;">KAYDEDİLDİ!</h2>
            <p style="font-size:22px;font-weight:800;margin-top:6px;">${escHtml(state.flashOverlay.name)}</p>
            <div style="margin-top:14px;background:rgba(0,0,0,0.25);padding:12px 24px;border-radius:16px;font-size:28px;font-weight:900;color:#FCD34D;">
              ${fmtKg(state.flashOverlay.amount)} KG
            </div>
          </div>
        ` : '';

        root.innerHTML = contentHtml + renderModals() + toastHtml + flashHtml;
        bindEvents();
      }

      // =========================================================================
      // 17. OLAY DİNLEYİCİLERİ (EVENT BINDINGS)
      // =========================================================================
      function processQrString(rawCode) {
        const clean = String(rawCode || '').trim().toUpperCase();
        if (!clean) return;
        const found = state.producers.find(
          p => (p.code && p.code.toUpperCase() === clean) || p.id.toUpperCase() === clean
        );
        if (!found) {
          notify(`"${clean}" karekoduna ait müstahsil bulunamadı!`, 'error');
          return;
        }
        if (state.currentUser.role === 'collector' && found.routeId !== state.currentUser.assignedRouteId) {
          notify(`Bu müstahsil (${found.name}) sizin aracınıza tanımlı değil!`, 'error');
          return;
        }
        stopCamera();
        state.qrScannerOpen = false;
        state.manualQrInput = '';
        if (state.currentUser.role === 'admin') state.selectedRoute = found.routeId;
        state.selectedProducerId = found.id;
        state.collectorMode = 'entry';
        state.kiloInput = '';
        state.gramInput = '';
        state.antibioticWarning = false;
        state.editingCollectionId = null;
        notify(`Karekod Okundu: ${found.name}`);
      }

      function startCamera() {
        state.qrScannerOpen = true;
        state.cameraError = '';
        render();

        if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
          state.cameraError = 'Tarayıcı kamera erişimi desteklemiyor. Aşağıdaki hızlı test butonlarını kullanabilirsiniz.';
          render();
          return;
        }

        navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' }, audio: false })
          .then(stream => {
            cameraStream = stream;
            const vid = document.getElementById('qr-video-el');
            if (vid) {
              vid.srcObject = stream;
              vid.play().catch(() => {});
            }
            if ('BarcodeDetector' in window) {
              try {
                const detector = new window.BarcodeDetector({ formats: ['qr_code'] });
                barcodeTimer = setInterval(async () => {
                  const v = document.getElementById('qr-video-el');
                  if (v && v.readyState >= 2) {
                    try {
                      const codes = await detector.detect(v);
                      if (codes && codes.length > 0 && codes[0].rawValue) {
                        processQrString(codes[0].rawValue);
                      }
                    } catch (e) {}
                  }
                }, 450);
              } catch (e) {}
            }
          })
          .catch(() => {
            state.cameraError = 'Kamera izni verilmedi veya cihazda kamera yok. Aşağıdaki tek tıkla "Okut →" butonlarını kullanabilirsiniz.';
            render();
          });
      }

      function bindEvents() {
        // Login Form
        const loginForm = document.getElementById('login-form');
        if (loginForm) {
          loginForm.onsubmit = function (e) {
            e.preventDefault();
            const uVal = document.getElementById('login-user').value.trim().toLowerCase();
            const pVal = document.getElementById('login-pass').value.trim();
            const found = state.users.find(u => u.username.toLowerCase() === uVal && u.password === pVal);
            if (!found) {
              notify('Kullanıcı adı veya şifre hatalı!', 'error');
              return;
            }
            loginAs(found);
          };
        }

        function loginAs(u) {
          state.currentUser = u;
          state.selectedDate = TODAY_STR;
          state.yogurtDate = TODAY_STR;
          state.collectorMode = 'select';
          if (u.role === 'collector' && u.assignedRouteId) {
            state.selectedRoute = u.assignedRouteId;
            state.activeTab = 'collector';
          } else if (u.role === 'warehouse') {
            state.activeTab = 'center';
          } else {
            state.activeTab = 'admin';
          }
          notify(`Hoş geldiniz, ${u.name}`);
        }

        // Data-action clicks
        document.querySelectorAll('[data-action]').forEach(el => {
          const action = el.getAttribute('data-action');
          if (el.tagName === 'SELECT' || el.tagName === 'INPUT') return;

          el.onclick = function () {
            if (action === 'quick-login') {
              const uid = el.getAttribute('data-uid');
              const u = state.users.find(x => x.id === uid);
              if (u) loginAs(u);
            } else if (action === 'logout') {
              stopCamera();
              state.currentUser = null;
              render();
            } else if (action === 'switch-tab') {
              state.activeTab = el.getAttribute('data-tab');
              state.collectorMode = 'select';
              render();
            } else if (action === 'set-shift') {
              state.selectedShift = el.getAttribute('data-shift');
              render();
            } else if (action === 'set-yog-shift') {
              state.yogurtShift = el.getAttribute('data-shift');
              render();
            } else if (action === 'reset-today') {
              state.selectedDate = TODAY_STR;
              render();
            } else if (action === 'reset-yogurt-today') {
              state.yogurtDate = TODAY_STR;
              render();
            } else if (action === 'pick-producer') {
              state.selectedProducerId = el.getAttribute('data-pid');
              state.collectorMode = 'entry';
              state.kiloInput = '';
              state.gramInput = '';
              state.antibioticWarning = false;
              state.editingCollectionId = null;
              render();
            } else if (action === 'back-to-select') {
              state.collectorMode = 'select';
              state.editingCollectionId = null;
              render();
            } else if (action === 'quick-add') {
              const delta = parseFloat(el.getAttribute('data-val')) || 0;
              const kEl = document.getElementById('entry-kilo');
              const gEl = document.getElementById('entry-gram');
              const curK = parseFloat(kEl.value || '0');
              const curG = parseFloat(gEl.value || '0');
              let decG = 0;
              if (gEl.value.trim() !== '') {
                decG = curG >= 100 ? curG / 1000 : curG >= 10 ? curG / 100 : curG / 10;
              }
              const next = Math.round((curK + decG + delta) * 1000) / 1000;
              const whole = Math.floor(next);
              const remG = Math.round((next - whole) * 1000);
              kEl.value = whole;
              gEl.value = remG > 0 ? remG : '';
              state.kiloInput = String(whole);
              state.gramInput = remG > 0 ? String(remG) : '';
            } else if (action === 'edit-col') {
              const cid = el.getAttribute('data-cid');
              const rec = state.collections.find(c => c.id === cid);
              if (!rec) return;
              if (state.currentUser.role !== 'admin' && rec.date !== TODAY_STR) {
                notify('Geçmiş kayıtlar sadece Admin tarafından düzenlenebilir!', 'error');
                return;
              }
              state.editingCollectionId = rec.id;
              state.selectedProducerId = rec.producerId;
              state.selectedShift = rec.shift;
              const w = Math.floor(rec.amount);
              const g = Math.round((rec.amount - w) * 1000);
              state.kiloInput = String(w);
              state.gramInput = g > 0 ? String(g) : '';
              state.antibioticWarning = Boolean(rec.antibioticWarning);
              state.collectorMode = 'entry';
              render();
            } else if (action === 'del-col') {
              const cid = el.getAttribute('data-cid');
              const rec = state.collections.find(c => c.id === cid);
              if (!rec) return;
              if (state.currentUser.role !== 'admin' && rec.date !== TODAY_STR) {
                notify('Geçmiş kayıtlar sadece Admin tarafından silinebilir!', 'error');
                return;
              }
              state.collections = state.collections.filter(c => c.id !== cid);
              persistAll();
              notify('Süt kaydı silindi.');
            } else if (action === 'open-qr-label') {
              state.qrLabelProducerId = el.getAttribute('data-pid');
              render();
            } else if (action === 'close-qr-label') {
              state.qrLabelProducerId = null;
              render();
            } else if (action === 'open-qr-scanner') {
              startCamera();
            } else if (action === 'close-qr-scanner') {
              stopCamera();
              state.qrScannerOpen = false;
              render();
            } else if (action === 'sim-qr') {
              processQrString(el.getAttribute('data-code'));
            } else if (action === 'del-yog') {
              const yid = el.getAttribute('data-yid');
              state.yogurtBatches = state.yogurtBatches.filter(b => b.id !== yid);
              persistAll();
              notify('Yoğurt üretim kaydı silindi, süt depoya iade edildi.');
            } else if (action === 'bulk-price') {
              const val = parseFloat(document.getElementById('bulk-price-val').value);
              if (isNaN(val) || val <= 0) {
                notify('Geçerli bir fiyat giriniz!', 'error');
                return;
              }
              state.producers = state.producers.map(p => ({ ...p, unitPrice: val }));
              persistAll();
              notify(`Tüm müstahsillerin birim fiyatı ${fmtMoney(val)}/kg yapıldı.`);
            } else if (action === 'del-user') {
              const uid = el.getAttribute('data-uid');
              state.users = state.users.filter(u => u.id !== uid);
              persistAll();
              notify('Kullanıcı silindi.');
            } else if (action === 'export-csv') {
              exportReportCsv();
            } else if (action === 'reset-demo') {
              localStorage.clear();
              window.location.reload();
            }
          };
        });

        // Collector search & filters
        const searchEl = document.getElementById('collector-search-input');
        if (searchEl) {
          searchEl.oninput = function () {
            state.collectorSearch = searchEl.value;
            render();
            const reFocus = document.getElementById('collector-search-input');
            if (reFocus) {
              reFocus.focus();
              reFocus.setSelectionRange(reFocus.value.length, reFocus.value.length);
            }
          };
        }

        const colRouteSel = document.getElementById('col-route-select');
        if (colRouteSel) colRouteSel.onchange = () => { state.selectedRoute = colRouteSel.value; render(); };

        const colDateInp = document.getElementById('col-date-input');
        if (colDateInp) colDateInp.onchange = () => { state.selectedDate = colDateInp.value; render(); };

        // Milk Entry Submit
        const milkForm = document.getElementById('milk-entry-form');
        if (milkForm) {
          milkForm.onsubmit = function (e) {
            e.preventDefault();
            const kVal = parseFloat(document.getElementById('entry-kilo').value || '0');
            const gRaw = document.getElementById('entry-gram').value.trim();
            const gVal = parseFloat(gRaw || '0');
            const anti = document.getElementById('entry-antibiotic').checked;

            let decG = 0;
            if (gRaw !== '') {
              decG = gVal >= 100 ? gVal / 1000 : gVal >= 10 ? gVal / 100 : gVal / 10;
            }
            const total = Math.round((kVal + decG) * 100) / 100;
            if (total <= 0) {
              notify('Lütfen geçerli bir kilo veya gram değeri giriniz!', 'error');
              return;
            }

            const routeId = getEffectiveRouteId();
            const prod = getProducer(state.selectedProducerId);

            if (state.editingCollectionId) {
              state.collections = state.collections.map(c =>
                c.id === state.editingCollectionId
                  ? { ...c, amount: total, antibioticWarning: anti, shift: state.selectedShift }
                  : c
              );
              state.editingCollectionId = null;
            } else {
              state.collections.unshift({
                id: 'col-' + Date.now(),
                date: state.selectedDate,
                shift: state.selectedShift,
                routeId: routeId,
                producerId: state.selectedProducerId,
                amount: total,
                antibioticWarning: anti
              });
            }

            persistAll();
            state.flashOverlay = { name: prod ? prod.name : 'Müstahsil', amount: total };
            state.collectorMode = 'select';
            state.kiloInput = '';
            state.gramInput = '';
            state.antibioticWarning = false;
            render();

            setTimeout(() => {
              state.flashOverlay = null;
              render();
            }, 1000);
          };
        }

        // Manual QR Form
        const manualQrForm = document.getElementById('manual-qr-form');
        if (manualQrForm) {
          manualQrForm.onsubmit = function (e) {
            e.preventDefault();
            processQrString(document.getElementById('manual-qr-field').value);
          };
        }

        // Center Weighing Controls
        const cDate = document.getElementById('center-date-input');
        if (cDate) cDate.onchange = () => { state.selectedDate = cDate.value; render(); };

        const cRoute = document.getElementById('center-route-select');
        if (cRoute) cRoute.onchange = () => { state.selectedRoute = cRoute.value; render(); };

        const wForm = document.getElementById('weighing-form');
        if (wForm) {
          wForm.onsubmit = function (e) {
            e.preventDefault();
            const val = parseFloat(document.getElementById('center-weight-input').value);
            const note = document.getElementById('center-note-input').value.trim();
            if (isNaN(val) || val < 0) {
              notify('Geçerli bir kantar tartımı giriniz!', 'error');
              return;
            }
            const id = `w-${state.selectedDate}-${state.selectedShift}-${state.selectedRoute}`;
            const rec = { id, date: state.selectedDate, shift: state.selectedShift, routeId: state.selectedRoute, centerWeight: val, note };
            const exists = state.weighings.some(w => w.id === id);
            state.weighings = exists ? state.weighings.map(w => w.id === id ? rec : w) : [rec, ...state.weighings];
            persistAll();
            notify('Merkez kantar tartımı kaydedildi. Depo çiğ süt stoğu güncellendi.');
          };
        }

        // Yogurt Production Controls
        const yDate = document.getElementById('yog-date-input');
        if (yDate) yDate.onchange = () => { state.yogurtDate = yDate.value; render(); };

        const yForm = document.getElementById('yogurt-form');
        if (yForm) {
          yForm.onsubmit = function (e) {
            e.preventDefault();
            const ferm = parseFloat(document.getElementById('yog-fermented').value);
            const nCnt = parseInt(document.getElementById('yog-normal').value || '0', 10);
            const sCnt = parseInt(document.getElementById('yog-sert').value || '0', 10);
            const k2Cnt = parseInt(document.getElementById('yog-2kg').value || '0', 10);
            const g900Cnt = parseInt(document.getElementById('yog-900g').value || '0', 10);
            const note = document.getElementById('yog-note').value.trim();

            const stock = getDepotStock();
            const id = `yog-${state.yogurtDate}-${state.yogurtShift}`;
            const existing = state.yogurtBatches.find(b => b.id === id);
            const maxAllowed = stock.remaining + (existing ? Number(existing.fermentedMilkKg) : 0);

            if (isNaN(ferm) || ferm <= 0) {
              notify('Mayalanacak süt miktarını giriniz!', 'error');
              return;
            }
            if (ferm > maxAllowed + 0.01) {
              notify(`Depodaki mevcut çiğ sütten (${fmtKg(maxAllowed)} kg) fazla mayalama yapılamaz!`, 'error');
              return;
            }
            const totYog = Math.round(((nCnt * 10) + (sCnt * 10) + (k2Cnt * 2) + (g900Cnt * 0.9)) * 100) / 100;
            if (totYog <= 0) {
              notify('En az bir süzme yoğurt çeşidi için adet giriniz!', 'error');
              return;
            }

            const ratio = Math.round((ferm / totYog) * 100) / 100;
            const rec = {
              id, date: state.yogurtDate, shift: state.yogurtShift,
              fermentedMilkKg: ferm, normalCount: nCnt, sertCount: sCnt,
              ikiKgCount: k2Cnt, dokuzYuzGrCount: g900Cnt, note
            };
            state.yogurtBatches = existing
              ? state.yogurtBatches.map(b => b.id === id ? rec : b)
              : [rec, ...state.yogurtBatches];
            persistAll();

            if (ratio > STRAINED_LIMIT) {
              notify(`UYARI: Süzme yoğurt oranı ${fmtRatio(ratio)} (3,20 üzerinde)! Kayıt uyarı ile işlendi.`, 'error');
            } else {
              notify(`Üretim kaydedildi! Çıkan Yoğurt: ${fmtKg(totYog)} kg • Oran: ${fmtRatio(ratio)}`);
            }
          };
        }

        // Cost & Tariff Controls
        const costDateEl = document.getElementById('cost-analysis-date');
        if (costDateEl) costDateEl.onchange = () => { state.costDate = costDateEl.value; render(); };

        const trfDateEl = document.getElementById('trf-date');
        if (trfDateEl) trfDateEl.onchange = () => { state.tariffFormDate = trfDateEl.value; render(); };

        const trfForm = document.getElementById('tariff-form');
        if (trfForm) {
          trfForm.onsubmit = function (e) {
            e.preventDefault();
            const eff = document.getElementById('trf-date').value;
            const rec = {
              id: 'trf-' + eff,
              effectiveFrom: eff,
              euroRate: parseFloat(document.getElementById('trf-eur').value) || 38.0,
              note: document.getElementById('trf-note').value.trim(),
              dogalgaz: parseFloat(document.getElementById('trf-dogalgaz').value) || 0,
              elektrik: parseFloat(document.getElementById('trf-elektrik').value) || 0,
              mazot: parseFloat(document.getElementById('trf-mazot').value) || 0,
              iscilik: parseFloat(document.getElementById('trf-iscilik').value) || 0,
              yemek: parseFloat(document.getElementById('trf-yemek').value) || 0,
              su: parseFloat(document.getElementById('trf-su').value) || 0,
              kova10NormalEur: parseFloat(document.getElementById('trf-k10n-eur').value) || 0,
              kova10SertEur: parseFloat(document.getElementById('trf-k10s-eur').value) || 0,
              kova2Eur: parseFloat(document.getElementById('trf-k2-eur').value) || 0,
              kova900Eur: parseFloat(document.getElementById('trf-k900-eur').value) || 0,
              wholesale10Normal: parseFloat(document.getElementById('trf-w10n').value) || 0,
              retail10Normal: parseFloat(document.getElementById('trf-r10n').value) || 0,
              wholesale10Sert: parseFloat(document.getElementById('trf-w10s').value) || 0,
              retail10Sert: parseFloat(document.getElementById('trf-r10s').value) || 0,
              wholesale2Kg: parseFloat(document.getElementById('trf-w2').value) || 0,
              retail2Kg: parseFloat(document.getElementById('trf-r2').value) || 0,
              wholesale900Gr: parseFloat(document.getElementById('trf-w900').value) || 0,
              retail900Gr: parseFloat(document.getElementById('trf-r900').value) || 0
            };
            const exists = state.tariffs.some(t => t.effectiveFrom === eff);
            state.tariffs = exists
              ? state.tariffs.map(t => t.effectiveFrom === eff ? rec : t)
              : [...state.tariffs, rec];
            state.costDate = eff;
            persistAll();
            notify(`${eff} tarihinden itibaren geçerli maliyet ve satış fiyatları kaydedildi.`);
          };
        }

        // Card Controls
        const cardProdSel = document.getElementById('card-prod-select');
        if (cardProdSel) cardProdSel.onchange = () => { state.cardProducerId = cardProdSel.value; render(); };

        const cardMonthInp = document.getElementById('card-month-input');
        if (cardMonthInp) cardMonthInp.onchange = () => { state.cardMonth = cardMonthInp.value; render(); };

        // Admin Producer Form (Duplicate Protection)
        const npForm = document.getElementById('admin-producer-form');
        if (npForm) {
          npForm.onsubmit = function (e) {
            e.preventDefault();
            const cari = document.getElementById('np-cari').value.trim().toUpperCase();
            const tc = document.getElementById('np-tc').value.replace(/\D/g, '');
            const name = document.getElementById('np-name').value.trim();
            const father = document.getElementById('np-father').value.trim();
            const birth = document.getElementById('np-birth').value;
            const farm = document.getElementById('np-farm').value.trim().toUpperCase();
            const phone = document.getElementById('np-phone').value.trim();
            const price = parseFloat(document.getElementById('np-price').value) || 18.0;
            const city = document.getElementById('np-city').value.trim();
            const dist = document.getElementById('np-dist').value.trim();
            const vil = document.getElementById('np-vil').value.trim();
            const routeId = document.getElementById('np-route').value;

            if (tc.length !== 11) {
              notify('T.C. Kimlik Numarası 11 haneli olmalıdır!', 'error');
              return;
            }
            if (state.producers.some(p => p.cariKodu.toUpperCase() === cari)) {
              notify(`MÜKERRER KAYIT: "${cari}" Cari Kodu zaten kayıtlı!`, 'error');
              return;
            }
            if (state.producers.some(p => p.tc === tc)) {
              notify(`MÜKERRER KAYIT: ${tc} T.C. Kimlik No zaten kayıtlı!`, 'error');
              return;
            }
            if (farm && state.producers.some(p => p.farmNo && p.farmNo.toUpperCase() === farm)) {
              notify(`MÜKERRER KAYIT: "${farm}" İşletme No zaten kayıtlı!`, 'error');
              return;
            }
            if (father && state.producers.some(p => p.name.toLowerCase() === name.toLowerCase() && (p.fatherName || '').toLowerCase() === father.toLowerCase())) {
              notify(`MÜKERRER KAYIT: ${name} (Baba: ${father}) kaydı zaten mevcut!`, 'error');
              return;
            }

            const qrCode = 'ALAKUZU-MST-' + (101 + state.producers.length);
            state.producers.push({
              id: 'p-' + Date.now(),
              code: qrCode,
              cariKodu: cari,
              tc, name, fatherName: father, birthDate: birth,
              farmNo: farm, phone, city, district: dist, village: vil,
              routeId, unitPrice: price
            });
            persistAll();
            notify(`${name} başarıyla kaydedildi (${qrCode}).`);
          };
        }

        // Inline producer updates
        document.querySelectorAll('[data-action="change-prod-route"]').forEach(sel => {
          sel.onchange = () => {
            const pid = sel.getAttribute('data-pid');
            state.producers = state.producers.map(p => p.id === pid ? { ...p, routeId: sel.value } : p);
            persistAll();
            notify('Müstahsil araç ataması güncellendi.');
          };
        });

        document.querySelectorAll('[data-action="change-prod-price"]').forEach(inp => {
          inp.onchange = () => {
            const pid = inp.getAttribute('data-pid');
            const val = parseFloat(inp.value);
            if (!isNaN(val) && val > 0) {
              state.producers = state.producers.map(p => p.id === pid ? { ...p, unitPrice: val } : p);
              persistAll();
              notify('Birim süt fiyatı güncellendi.');
            }
          };
        });

        // Admin User & Route Forms
        const nuForm = document.getElementById('admin-user-form');
        if (nuForm) {
          nuForm.onsubmit = function (e) {
            e.preventDefault();
            const name = document.getElementById('nu-fullname').value.trim();
            const username = document.getElementById('nu-username').value.trim().toLowerCase();
            const password = document.getElementById('nu-pass').value.trim();
            const role = document.getElementById('nu-role').value;
            const assignedRouteId = role === 'collector' ? document.getElementById('nu-route').value : null;

            if (state.users.some(u => u.username.toLowerCase() === username)) {
              notify('Bu kullanıcı adı zaten kullanılıyor!', 'error');
              return;
            }
            state.users.push({ id: 'u-' + Date.now(), name, username, password, role, assignedRouteId });
            persistAll();
            notify(`${name} kullanıcısı eklendi.`);
          };
        }

        document.querySelectorAll('[data-action="change-user-route"]').forEach(sel => {
          sel.onchange = () => {
            const uid = sel.getAttribute('data-uid');
            state.users = state.users.map(u => u.id === uid ? { ...u, assignedRouteId: sel.value } : u);
            persistAll();
            notify('Kullanıcı araç plakası güncellendi.');
          };
        });

        const nrForm = document.getElementById('admin-route-form');
        if (nrForm) {
          nrForm.onsubmit = function (e) {
            e.preventDefault();
            const plate = document.getElementById('nr-plate').value.trim().toUpperCase();
            const name = document.getElementById('nr-name').value.trim();
            state.routes.push({ id: 'arac-' + Date.now(), plate, name });
            persistAll();
            notify(`${plate} plakalı araç eklendi.`);
          };
        }

        // Report Filters
        const rStart = document.getElementById('rep-start');
        if (rStart) rStart.onchange = () => { state.repStart = rStart.value; render(); };

        const rEnd = document.getElementById('rep-end');
        if (rEnd) rEnd.onchange = () => { state.repEnd = rEnd.value; render(); };

        const rRoute = document.getElementById('rep-route');
        if (rRoute) rRoute.onchange = () => { state.repRoute = rRoute.value; render(); };

        const rDist = document.getElementById('rep-dist');
        if (rDist) rDist.onchange = () => { state.repDistrict = rDist.value; state.repVillage = 'ALL'; render(); };

        const rVil = document.getElementById('rep-vil');
        if (rVil) rVil.onchange = () => { state.repVillage = rVil.value; render(); };

        const rSearch = document.getElementById('rep-search');
        if (rSearch) {
          rSearch.oninput = () => {
            state.repSearch = rSearch.value;
            render();
            const el = document.getElementById('rep-search');
            if (el) { el.focus(); el.setSelectionRange(el.value.length, el.value.length); }
          };
        }

        const rSort = document.getElementById('rep-sort');
        if (rSort) {
          rSort.onchange = () => {
            const parts = rSort.value.split('-');
            state.repSortField = parts[0];
            state.repSortDir = parts[1];
            render();
          };
        }

        const rOnly = document.getElementById('rep-only-milk');
        if (rOnly) rOnly.onchange = () => { state.repOnlyMilk = rOnly.checked; render(); };
      }

      function exportReportCsv() {
        const headers = ['Cari Kodu', 'T.C.', 'Ad Soyad', 'İlçe', 'Mahalle', 'Plaka', 'Sabah (Kg)', 'Akşam (Kg)', 'Toplam Süt (Kg)', 'Birim Fiyat (TL)', 'Toplam Hakediş (TL)'];
        const lines = [headers.join(';')];
        state.producers.forEach(p => {
          const cols = state.collections.filter(c => c.producerId === p.id && (!state.repStart || c.date >= state.repStart) && (!state.repEnd || c.date <= state.repEnd));
          const sabah = cols.filter(c => c.shift === 'Sabah').reduce((s, c) => s + c.amount, 0);
          const aksam = cols.filter(c => c.shift === 'Akşam').reduce((s, c) => s + c.amount, 0);
          const tot = Math.round((sabah + aksam) * 100) / 100;
          const pay = Math.round(tot * (Number(p.unitPrice) || 18) * 100) / 100;
          lines.push([
            p.cariKodu, p.tc, `"${p.name}"`, p.district, p.village, getRoute(p.routeId).plate,
            String(sabah).replace('.', ','), String(aksam).replace('.', ','),
            String(tot).replace('.', ','), String(p.unitPrice).replace('.', ','), String(pay).replace('.', ',')
          ].join(';'));
        });

        const blob = new Blob(['\uFEFF' + lines.join('\n')], { type: 'text/csv;charset=utf-8;' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `Alakuzular_Rapor_${state.repStart}_${state.repEnd}.csv`;
        a.click();
        URL.revokeObjectURL(url);
        notify('Excel (CSV) raporu indirildi.');
      }

      // İlk Başlatma
      render();
    })();
  </script>
</body>
